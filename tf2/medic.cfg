exec config.cfg
exec autoexec.cfg

//
// Weapon aliases
//
alias medigun "slot2;autocall_initial"
alias needlegun "slot1;autocall_temp"
alias ubersaw "slot3;autocall_temp"

//
// Autocall changer
// Bubbles radar
//

alias autocall_initial "hud_medicautocallersthreshold 50" //health to autocall with medigun
alias autocall_temp "hud_medicautocallersthreshold 99" //health to autocall with syringe
alias +autocall_temp_hit "autocall_temp"
alias -autocall_temp_hit "autocall_initial"


//
// Binds
//
unbind "1"
unbind "2"
unbind "3"
bind "1" "medigun"
bind "2" "needlegun"
bind "3" "ubersaw"
