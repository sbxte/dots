//
// Binds
//
unbindall

// Main gameplay
// Note: WASD at null movement script below
bind "'" "+moveup"
bind "/" "+movedown"

bind "0" "slot10"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "q" "lastinv"

bind "r" "+reload"

bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "+attack3"
bind "mwheelup" "invprev"
bind "mwheeldown" "invnext"

bind "SHIFT" "+duck"
bind "SPACE" "+jump"
bind "TAB" "+showscores"
bind "ESCAPE" "cancelselect"
bind "PAUSE" "pause"

bind "," "changeclass"
bind "." "changeteam"

bind "KP_END" "load_itempreset 0"
bind "KP_DOWNARROW" "load_itempreset 1"
bind "KP_PGDN" "load_itempreset 2"
bind "KP_LEFTARROW" "load_itempreset 3"

bind "k" "explode"

// Notifs, Alerts, Voice, Taunt
// (Interactions)
bind "[" "cl_trigger_first_notification"
bind "]" "cl_decline_first_notification"

bind "e" "voicemenu 0 0"
bind "f" "voicemenu 2 0"

bind "ENTER" "say"
bind "t" "say_team"
bind "\" "say_party"

bind "v" "+voicerecord"
bind "z" "voice_menu_1"
bind "x" "voice_menu_2"
bind "c" "voice_menu_3"

bind "g" "+taunt"
bind "h" "+use_action_slot_item"
bind "l" "dropitem"
bind "y" "voicemenu 1 6"

// Menu
bind "m" "open_charinfo_direct"
bind "n" "open_charinfo_backpack"

// Misc functions
bind "`" "toggleconsole"
bind "i" "showmapinfo"
bind "F1" "+showroundinfo"
bind "F2" "show_quest_log"
bind "F3" "show_matchmaking"
bind "F5" "screenshot"
bind "F6" "save_replay"
bind "F7" "abuse_report_queue"
bind "F9" "vr_toggle"
bind "F10" "quit prompt"
bind "F11" "vr_reset_home_pos"
bind "F12" "replay_togglereplaytips"



