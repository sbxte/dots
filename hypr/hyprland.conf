#################
### ECOSYSTEM ###
#################

ecosystem {
	no_update_news = true
}

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,highres,auto,1


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = xhost +local:
exec-once = waybar
exec-once = hyprpaper
exec-once = swaync


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,12
env = HYPRCURSOR_SIZE,12


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 5

    border_size = 3

    col.active_border = rgba(00ff99ee)
    col.inactive_border = rgba(00ccffee)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

	# Default layout
    layout = dwindle
}

# Grouped windows
# https://wiki.hyprland.org/Configuring/Variables/#group
group {
	col.border_active = rgba(00ff99ee) rgba(00ccffee) 90deg
	col.border_inactive = rgba(00ccffee)
	col.border_locked_active = rgba(00ff99ee) rgba(fc03c2ff) 90deg
	col.border_locked_inactive = rgba(fc03c2ff)

	# https://wiki.hyprland.org/Configuring/Variables/#groupbar
	groupbar {
		enabled = true

		font_size = 12
		height = 12
		render_titles = true

		indicator_height = 6
		rounding = 3
		round_only_edges = false

		col.active = rgba(ff0000ff)
		col.inactive = rgba(8400ff88)
		col.locked_active = rgba(ff0000ff)
		col.locked_inactive = rgba(8400ff88)
	}
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 5

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

	shadow {
		enabled = true
		range = 4
		render_power = 3
		color = rgba(1a1a1aee)
	}

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 0
    animation = workspaces, 1, 4, default
	animation = specialWorkspace, 1, 4, default, slidevert
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
	mfact = 0.60
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

# https://wiki.hyprland.org/Configuring/Variables/#binds
binds {
	allow_pin_fullscreen = true
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = compose:ralt, caps:escape_shifted_capslock
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
		disable_while_typing = true
    }
	touchdevice {
		enabled = true
	}
}

# https://wiki.hyprland.org/Configuring/Variables/#cursor
cursor {
	no_warps = true
	# hide_on_key_press = true

	zoom_rigid = true
	zoom_disable_aa = true
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = Super_L
$launch_app = ~/.config/hypr/scripts/launch_app.sh

# Quick launch
# bind = $mainMod, Q, exec, $launch_app alacritty
bind = $mainMod, Q, exec, $launch_app kitty
bind = $mainMod, E, exec, $launch_app nautilus
bind = $mainMod, R, exec, $launch_app wofi --show drun
bind = $mainMod, B, exec, $launch_app firefox


# Generic window actions
bind = $mainMod, C, killactive,

bind = $mainMod SHIFT, V, pin,
bind = $mainMod, V, togglefloating,

bind = $mainMod, G, togglegroup,
bind = $mainMod SHIFT, G, lockactivegroup, toggle
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1

# Layout actions
bind = $mainMod, U, exec, hyprctl keyword general:layout "dwindle"
bind = $mainMod SHIFT, U, exec, hyprctl keyword general:layout "master"

bind = $mainMod ALT, 1, layoutmsg, togglesplit
bind = $mainMod ALT, 2, layoutmsg, swapsplit

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, H, movewindoworgroup, l
bind = $mainMod SHIFT, L, movewindoworgroup, r
bind = $mainMod SHIFT, K, movewindoworgroup, u
bind = $mainMod SHIFT, J, movewindoworgroup, d

# Change focus between windows in groups
# NOTE: Keysms (bind s) appear to be somewhat buggy idk why
bind = $mainMod, W, changegroupactive, f
bind = $mainMod SHIFT, W, changegroupactive, b
bind = $mainMod CTRL, 1, changegroupactive, 1
bind = $mainMod CTRL, 2, changegroupactive, 2
bind = $mainMod CTRL, 3, changegroupactive, 3
bind = $mainMod CTRL, 4, changegroupactive, 4
bind = $mainMod CTRL, 5, changegroupactive, 5
bind = $mainMod CTRL, 6, changegroupactive, 6

# Cycle between windows
# (cause apparently you cannot focus on floating windows otherwise)
bind = $mainMod CTRL, bracketleft, cyclenext, prev
bind = $mainMod CTRL, bracketright, cyclenext, next

# Resize windows
bind = $mainMod CTRL, left, resizeactive, -80 0
bind = $mainMod CTRL, right, resizeactive, 80 0
bind = $mainMod CTRL, up, resizeactive, 0 80
bind = $mainMod CTRL, down, resizeactive, 0 -80
bind = $mainMod CTRL, h, resizeactive, -80 0
bind = $mainMod CTRL, l, resizeactive, 80 0
bind = $mainMod CTRL, k, resizeactive, 0 -80
bind = $mainMod CTRL, j, resizeactive, 0 80

# Cycle between workspaces
bind = $mainMod, bracketleft, workspace, e-1
bind = $mainMod, bracketright, workspace, e+1

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod CTRL, S, movetoworkspace, +0

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Lock screen
bind = $mainMod ALT, L, exec, systemctl start --user hyprlock

# Sound and media binds
bind = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = ,XF86AudioLowerVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%-
bind = SHIFT, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
bind = SHIFT, XF86AudioLowerVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%-
bind = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bind = ,XF86AudioPlay, exec, playerctl play-pause
bind = ,XF86AudioPause, exec, playerctl play-pause
bind = ,XF86AudioStop, exec, playerctl stop
bind = ,XF86AudioNext, exec, playerctl next
bind = ,XF86AudioPrev, exec, playerctl previous

# Brightness
bind = ,XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/backlight.sh inc
bind = ,XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/backlight.sh dec

# Cursor Zoom 
$cursorzoom = ~/.config/hypr/scripts/cursorzoom.sh
bind = $mainMod CTRL, mouse:276, exec, $cursorzoom in # mouse wheel direction is flipped for some reason
bind = $mainMod CTRL, mouse:275, exec, $cursorzoom reset 

# Screen capture
$screencapture = ~/.config/hypr/scripts/screencapture.sh

bind = $mainMod, Print, exec, $screencapture image region
bind = $mainMod CTRL, Print, exec, $screencapture image window
bind = $mainMod ALT, Print, exec, $screencapture image monitor
bind = $mainMod SHIFT, Print, exec, $screencapture video

bind = $mainMod SHIFT_ALT, F12, exec, $screencapture open
bind = $mainMod, F12, exec, $screencapture image region
bind = $mainMod CTRL, F12, exec, $screencapture image window
bind = $mainMod ALT, F12, exec, $screencapture image monitor
bind = $mainMod SHIFT, F12, exec, $screencapture video

# Game mode
bind = $mainMod, F1, exec, ~/.config/hypr/scripts/gamemode.sh

# Notifications
bind = $mainMod, M, exec, swaync-client -t


##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# This might be the most scuffed window rule I have
# And its all because hyprland does not let you color pinned windows separately
# via the usual method
windowrule = match:pin on, match:float on, match:focus on, border_color rgba(00ff99ee) rgba(eb0000ff) 90deg
windowrule = match:pin on, match:float on, match:focus off, border_color rgba(00ccffee) rgba(eb0000ff)

windowrule = match:workspace s[true], float on

windowrule = match:class .*, suppress_event maximize  # You'll probably like this.

windowrule {
	name = "Zenity"
	match:class = zenity

	float = on
	pin = on
}

windowrule {
	name = "PavuControl"
	match:class = "pavucontrol"

	float = on
	pin = on 
	size = 900 500
}

windowrule = match:class .*Nautilus, float on, size 900 600

windowrule = match:class .*Loupe, float on, size 900 600

windowrule = match:class Alacritty, size 800 500

# Xwaylandvideobridge
windowrule {
	name = "XWaylandVideoBridge"
	match:class = xwaylandvideobridge

	opacity = off, 
	max_size = on on,
	no_anim = on
	no_initial_focus = on
	no_blur = on
}
